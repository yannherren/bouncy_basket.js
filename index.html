<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="style.css">
    <title>Yann's Bouncy Basketball</title>
    <script type="module" src="index.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
</head>
<body>
<div class="change-scenery">
    <img src="assets/levelup.png" alt="levelup" />
</div>

<div class="game-over">
    <img src="assets/gameover.png" alt="levelup" />
    <span class="text final-level">Level: <span>Beginner</span></span>
    <span class="text final-score">Score: <span>0</span></span>
    <a href="." class="restart">Restart</a>
</div>

<div class="play-overlay">
    <img src="assets/icons/play.png" height="96" alt="play"/>
</div>
<div class="logo">
    <img src="assets/logo.png">
    <span class="text">Grab the ball to start!</span>
    <span class="text" style="font-size: 24px">Bounce as many times as possible before scoring.</span>
</div>
<div class="scores">
    <div class="current">
        <span class="bounces-score">Bounces: <span>0</span></span>
        <span class="time-left">Time left: <span>1:00</span></span>
    </div>
    <div class="overall">
        <span class="overall-score">Score: <span>0/10</span></span>
        <span class="level-name"><span>Beginner</span></span>
    </div>

</div>
<div class="content">
    <span class="ball"></span>
    <div class="hoop-container">
        <div class="hoop-boundaries">
            <span class="boundary"></span>
            <span class="boundary-1"></span>
        </div>
        <div class="hoop-checkpoints">
            <span class="checkpoint"></span>
            <span class="checkpoint-1"></span>
        </div>
        <img src="assets/hoops/hoop1.png" class="hoop-img" alt="hoop">
        <img src="assets/hoops/hoop_overlay1.png" class="hoop-overlay" alt="hoop">

    </div>

</div>
</body>
</html>
